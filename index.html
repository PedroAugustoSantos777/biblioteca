<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cadastro de Livros</h1>

    <form id="formLivro">

        <label>Autor:</label>
        <input type="text" id="autorLivro" required>

        <label>Descrição:</label>
        <textarea id="descricaoLivro" required></textarea>

        <label>Ano de publicação:</label>
        <input type="number" id="anoPublicacao"
               min="1" max="2026" required>

        <button type="submit">Cadastrar Livro</button>

    </form>

    <p id="mensagem"></p>

    <a href="../back/listar.php">
        Ver livros cadastrados
    </a>

    <script>

        function adicionarLivros() {

            let autorLivro = document.getElementById("autorLivro").value;
            let descricaoLivro = document.getElementById("descricaoLivro").value;
            let anoPublicacao = document.getElementById("anoPublicacao").value;

            fetch("../back/index.php", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    autorLivro: autorLivro,
                    descricaoLivro: descricaoLivro,
                    anoPublicacao: anoPublicacao

                })

            })

            .then(resposta => resposta.text())

            .then(dados => {

                document.getElementById("mensagem").innerText = dados;

            })

            .catch(erro => {

                document.getElementById("mensagem").innerText = "Erro ao cadastrar";

            });

        }

        document.getElementById("formLivro").addEventListener("submit", function(evento) {

            evento.preventDefault();

            adicionarLivros();

        });

    </script>

</body>

</html>
